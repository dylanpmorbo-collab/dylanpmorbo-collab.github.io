backend:
  name: github
  repo: dylanpmorbo-collab/aquello-que-nos-rodea
  branch: main

media_folder: "Aquello_que_nos_Rodea_WEB_CMS_v2/assets/uploads"
public_folder: "/assets/uploads"

locale: "es"

collections:
  - name: "relatos"
    label: "Relatos"
    label_singular: "Relato"
    folder: "Aquello_que_nos_Rodea_WEB_CMS_v2/content/relatos"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "Archivo {{archive_number}} · {{title}}"
    sortable_fields: ["archive_number", "title"]
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Dirección web", name: "slug", widget: "string", hint: "Ejemplo: el-legado-de-rasputin. Solo letras, números y guiones." }
      - { label: "Número de archivo", name: "archive_number", widget: "string", default: "002" }
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - { label: "Destacar en portada", name: "featured", widget: "boolean", default: false }
      - { label: "Contenido +18", name: "age_restricted", widget: "boolean", default: false }
      - { label: "Tiempo de lectura", name: "reading_time", widget: "string", default: "10 min aprox." }
      - { label: "Frase / descripción breve", name: "excerpt", widget: "text" }
      - { label: "Portada", name: "cover", widget: "image", choose_url: false }
      - { label: "Advertencia de contenido", name: "content_warning", widget: "text", required: false }
      - { label: "Texto del relato", name: "body", widget: "markdown" }

  - name: "archivo"
    label: "El Archivo"
    label_singular: "Ficha de archivo"
    folder: "Aquello_que_nos_Rodea_WEB_CMS_v2/content/archivo"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{category}} // {{archive_number}} · {{title}}"
    sortable_fields: ["category", "archive_number", "title"]
    fields:
      - { label: "Nombre / título", name: "title", widget: "string" }
      - { label: "Número", name: "archive_number", widget: "string", default: "002" }
      - label: "Tipo de ficha"
        name: "category"
        widget: "select"
        options: ["ENTIDAD", "LUGAR", "ORGANIZACIÓN", "DOCUMENTO", "SUCESO", "OTRO"]
        default: "ENTIDAD"
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - { label: "Imagen", name: "image", widget: "image", choose_url: false, required: false }
      - { label: "Estado", name: "status", widget: "string", default: "Documentado" }
      - { label: "Descripción", name: "summary", widget: "text" }
      - { label: "Nota de archivo", name: "note", widget: "text", required: false }
      - label: "Datos de la ficha"
        name: "facts"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Campo", name: "label", widget: "string", hint: "Ej.: Procedencia, Tamaño, Ocupación, Localización…" }
          - { label: "Valor", name: "value", widget: "string" }
      - { label: "Información adicional", name: "body", widget: "markdown", required: false }

  - name: "personajes"
    label: "Personajes"
    label_singular: "Personaje"
    folder: "Aquello_que_nos_Rodea_WEB_CMS_v2/content/personajes"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "name"
    summary: "{{archive_number}} · {{name}} · {{status}}"
    sortable_fields: ["archive_number", "name", "status"]
    fields:
      - { label: "Nombre", name: "name", widget: "string" }
      - { label: "Número de expediente", name: "archive_number", widget: "string", default: "P-001" }
      - { label: "Publicado", name: "published", widget: "boolean", default: true }
      - { label: "Imagen", name: "image", widget: "image", choose_url: false, required: false }
      - { label: "Estado", name: "status", widget: "string", default: "Documentado" }
      - { label: "Alias", name: "alias", widget: "string", required: false }
      - { label: "Edad", name: "age", widget: "string", required: false }
      - { label: "Ocupación", name: "occupation", widget: "string", required: false }
      - { label: "Descripción breve", name: "summary", widget: "text" }
      - label: "Datos de la ficha"
        name: "facts"
        widget: "list"
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - { label: "Campo", name: "label", widget: "string", hint: "Ej.: Afiliación, Residencia, Relación, Estado conocido…" }
          - { label: "Valor", name: "value", widget: "string" }
      - { label: "Información adicional", name: "body", widget: "markdown", required: false }

  - name: "conexiones"
    label: "Conexiones"
    label_singular: "Conexión"
    folder: "Aquello_que_nos_Rodea_WEB_CMS_v2/content/conexiones"
    create: true
    delete: true
    extension: "json"
    format: "json"
    identifier_field: "title"
    summary: "{{archive_number}} · {{title}} · {{status}}"
    sortable_fields: ["archive_number", "title", "status"]
    fields:
      - { label: "Número", name: "archive_number", widget: "string" }
      - { label: "Nombre", name: "title", widget: "string" }
      - label: "Estado"
        name: "status"
        widget: "select"
        options: ["DISPONIBLE", "RESTRINGIDO", "CORRUPTO", "DESCONOCIDO"]
        default: "RESTRINGIDO"
      - { label: "Publicado", name: "published", widget: "boolean", default: true }

  - name: "configuracion"
    label: "Configuración del sitio"
    files:
      - label: "Textos generales"
        name: "site"
        file: "Aquello_que_nos_Rodea_WEB_CMS_v2/content/config/site.json"
        format: "json"
        fields:
          - { label: "Nombre del universo", name: "site_title", widget: "string" }
          - { label: "Autor", name: "author", widget: "string" }
          - { label: "Frase principal", name: "tagline", widget: "string" }
          - { label: "Título de presentación", name: "intro_title", widget: "string" }
          - { label: "Presentación 1", name: "intro_text", widget: "text" }
          - { label: "Presentación 2", name: "intro_text_2", widget: "text" }
          - { label: "Nota del pie", name: "footer_note", widget: "text" }
