name: Publicar Aquello que nos Rodea

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Construir la web
        working-directory: Aquello_que_nos_Rodea_WEB_CMS_v2
        run: npm run build

      - name: Mostrar peso de la web publicada
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = 'Aquello_que_nos_Rodea_WEB_CMS_v2/dist';
          const totals = { imagenes: 0, videos: 0, otros: 0, archivos: 0 };
          const images = new Set(['.avif', '.gif', '.jpeg', '.jpg', '.png', '.svg', '.webp']);
          const videos = new Set(['.m4v', '.mp4', '.mov', '.webm']);

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) { visit(file); continue; }
              if (!entry.isFile()) continue;
              const bytes = fs.statSync(file).size;
              const ext = path.extname(entry.name).toLowerCase();
              totals[images.has(ext) ? 'imagenes' : videos.has(ext) ? 'videos' : 'otros'] += bytes;
              totals.archivos++;
            }
          }

          visit(root);
          const mb = bytes => (bytes / 1048576).toFixed(2);
          const total = totals.imagenes + totals.videos + totals.otros;
          const summary = `## Peso de la web publicada\n\n**${mb(total)} MB** en ${totals.archivos} archivos.\n\n| Tipo | Peso |\n|---|---:|\n| Imágenes | ${mb(totals.imagenes)} MB |\n| Vídeos | ${mb(totals.videos)} MB |\n| Otros | ${mb(totals.otros)} MB |\n\nMide los archivos de la web que se publican ahora, no las versiones antiguas del historial de Git.\n`;
          console.log(summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir web construida
        uses: actions/upload-pages-artifact@v4
        with:
          path: Aquello_que_nos_Rodea_WEB_CMS_v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
