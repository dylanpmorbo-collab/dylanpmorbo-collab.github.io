  - name: archivo
    label: El Archivo
    type: collection
    path: Aquello_que_nos_Rodea_WEB_CMS_v2/content/archivo
    format: json
    filename: "{primary}.json"
    view:
      fields: [category, archive_number, title, status, published]
      primary: title
      sort: [category, archive_number, title]
      search: [title, summary, category, archive_number]
    fields:
      - name: title
        label: Nombre / título
        type: string
        required: true
      - name: slug
        label: Dirección web personalizada
        type: string
        required: false
        description: "Opcional. Si se deja vacío, la web la crea automáticamente a partir del título. Usa minúsculas, números y guiones."
        pattern:
          regex: "^(?:[a-z0-9-]+)?$"
          message: "Usa solo minúsculas, números y guiones."
      - name: archive_number
        label: Número
        type: string
        default: "002"
      - name: category
        label: Tipo de ficha
        type: select
        default: ENTIDAD
        options:
          values: [ENTIDAD, LUGAR, PLANO, ORGANIZACIÓN, DOCUMENTO, SUCESO, OTRO]
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: image
        label: Imagen principal / miniatura
        type: image
        required: false
        options:
          media: archivo
        description: "Aparece en la ficha resumida y en la cabecera del expediente completo."
      - name: status
        label: Estado
        type: string
        default: Documentado
      - name: summary
        label: Resumen para la ficha
        type: text
        description: "Texto breve que se ve en la página de la sección antes de abrir el expediente."
      - name: note
        label: Nota de archivo
        type: text
        required: false
      - name: facts
        label: Datos de la ficha
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - name: label
            label: Campo
            type: string
          - name: value
            label: Valor
            type: string
      - name: body
        label: Información principal del expediente
        type: rich-text
        required: false
        options:
          media: archivo
        description: "Aquí va la información extensa que sólo aparece al abrir el expediente completo."
      - name: sections
        label: Apartados / información descubierta
        type: object
        required: false
        list:
          max: 20
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Título del apartado
            type: string
          - name: body
            label: Contenido
            type: rich-text
            options:
              media: archivo
      - name: gallery
        label: Galería del expediente
        type: object
        required: false
        list:
          max: 10
          collapsible:
            collapsed: true
            summary: "{index} · {caption}"
        fields:
          - name: image
            label: Imagen
            type: image
            required: true
            options:
              media: archivo
          - name: caption
            label: Pie de imagen
            type: string
            required: false
          - name: description
            label: Nota / descripción
            type: text
            required: false
      - name: show_documents
        label: Mostrar documentos navegables
        type: boolean
        default: false
        description: "Actívalo para mostrar diarios, expedientes, manuscritos o documentos de varias páginas en un visor independiente de la galería."
      - name: documents
        label: Documentos navegables
        type: object
        required: false
        list:
          max: 10
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Título del documento
            type: string
            required: true
          - name: description
            label: Descripción
            type: text
            required: false
          - name: pages
            label: Páginas
            type: object
            list:
              max: 60
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                label: Página
                type: image
                required: true
                options:
                  media: documentos
              - name: caption
                label: Nombre / pie de página
                type: string
                required: false
              - name: translations
                label: Traducciones de esta página
                type: object
                required: false
                description: "Opcional. El documento original siempre se muestra por defecto. Añade aquí una o varias traducciones de esta página."
                list:
                  max: 12
                  collapsible:
                    collapsed: true
                    summary: "{language} · {code}"
                fields:
                  - name: language
                    label: Idioma
                    type: string
                    required: true
                    description: "Ejemplo: Español, English, Français."
                  - name: code
                    label: Código corto
                    type: string
                    required: true
                    description: "Ejemplo: es, en, fr. Usa el mismo código en todas las páginas del documento."
                    pattern:
                      regex: "^[A-Za-z0-9-]{2,12}$"
                      message: "Usa un código corto como es, en, fr o pt-BR."
                  - name: text
                    label: Texto traducido
                    type: text
                    required: true
                    description: "Respeta los saltos de línea que quieras conservar en la capa de traducción."
      - name: show_police_report
        label: Mostrar informes
        type: boolean
        default: false
        description: "Muestra carpetas compactas al final de la ficha. Cada informe se abre dentro de la página."
      - name: police_reports
        label: Informes
        type: object
        required: false
        description: "Hasta cinco carpetas. Cada informe se reparte en folios que se leen de uno en uno."
        list:
          max: 5
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Título / referencia
            type: string
            required: true
            default: "INFORME"
          - name: type
            label: Tipo de informe
            type: string
            required: false
            default: "POLICIAL"
            description: "Escribe la clase de informe: policial, médico, forense, psicológico u otra. Los antiguos se consideran policiales hasta que los cambies."
          - name: image
            label: Imagen 1 / portada de la carpeta
            type: image
            required: false
            options:
              media: informes_policiales
            description: "Esta imagen se ve en la carpeta y, al abrir, al principio del informe."
          - name: image_2
            label: Imagen 2 del informe
            type: image
            required: false
            options:
              media: informes_policiales
          - name: image_3
            label: Imagen 3 del informe
            type: image
            required: false
            options:
              media: informes_policiales
          - name: body
            label: Texto del informe (Markdown)
            type: rich-text
            required: true
            options:
              format: markdown
              media: false
              switcher: true
            description: "Admite títulos, negritas, cursivas, listas, citas y enlaces. El texto se reparte en folios conservando los párrafos."
      - name: show_related_archive
        label: Mostrar archivos relacionados
        type: boolean
        default: false
        description: "Actívalo cuando quieras revelar enlaces a otros expedientes. Si está desactivado, el bloque no aparece ni deja hueco."
      - name: related_archive
        label: Archivos relacionados
        type: object
        required: false
        description: "Opcional. Estos enlaces se muestran al final del expediente cuando activas la opción anterior."
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{type} · {title}"
        fields:
          - name: type
            label: Tipo
            type: select
            default: ARCHIVO
            options:
              values: [ARCHIVO, RELATO, MICRORRELATO, ENTIDAD, PERSONAJE, LUGAR, PLANO, ORGANIZACIÓN, DOCUMENTO, SUCESO, OTRO]
