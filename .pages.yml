      - name: alias
        label: Alias
        type: string
        required: false
      - name: age
        label: Edad
        type: string
        required: false
      - name: occupation
        label: Ocupación
        type: string
        required: false
      - name: summary
        label: Resumen para la ficha
        type: text
        description: "Texto breve que se ve en PERSONAJES antes de abrir el expediente."
      - name: note
