media:
  input: Aquello_que_nos_Rodea_WEB_CMS_v2/assets/uploads
  output: /assets/uploads
  rename: safe
  categories: [image]

content:
  - name: relatos
    label: Relatos
    type: collection
    path: Aquello_que_nos_Rodea_WEB_CMS_v2/content/relatos
    format: json
    filename: "{primary}.json"
    view:
      fields: [archive_number, title, published, featured]
      primary: title
      sort: [archive_number, title]
      search: [title, excerpt, archive_number]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: Dirección web
        type: string
        required: true
        description: "Ejemplo: el-legado-de-rasputin. Solo letras, números y guiones."
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Usa solo minúsculas, números y guiones."
      - name: archive_number
        label: Número de archivo
        type: string
        default: "002"
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: featured
        label: Destacar en portada
        type: boolean
        default: false
      - name: age_restricted
        label: Contenido +18
        type: boolean
        default: false
      - name: reading_time
        label: Tiempo de lectura
        type: string
        default: "10 min aprox."
      - name: excerpt
        label: Frase / descripción breve
        type: text
      - name: cover
        label: Portada
        type: image
      - name: content_warning
        label: Advertencia de contenido
        type: text
        required: false
      - name: body
        label: Texto del relato
        type: rich-text

  - name: archivo
    label: El Archivo
    type: collection
    path: Aquello_que_nos_Rodea_WEB_CMS_v2/content/archivo
    format: json
    filename: "{primary}.json"
    view:
      fields: [category, archive_number, title, status, published]
      primary: title
      sort: [category, archive_number, title]
      search: [title, summary, category, archive_number]
    fields:
      - name: title
        label: Nombre / título
        type: string
        required: true
      - name: slug
        label: Dirección web personalizada
        type: string
        required: false
        description: "Opcional. Si se deja vacío, la web la crea automáticamente a partir del título. Usa minúsculas, números y guiones."
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Usa solo minúsculas, números y guiones."
      - name: archive_number
        label: Número
        type: string
        default: "002"
      - name: category
        label: Tipo de ficha
        type: select
        default: ENTIDAD
        options:
          values: [ENTIDAD, LUGAR, PLANO, ORGANIZACIÓN, DOCUMENTO, SUCESO, OTRO]
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: image
        label: Imagen principal / miniatura
        type: image
        required: false
        description: "Aparece en la ficha resumida y en la cabecera del expediente completo."
      - name: status
        label: Estado
        type: string
        default: Documentado
      - name: summary
        label: Resumen para la ficha
        type: text
        description: "Texto breve que se ve en la página de la sección antes de abrir el expediente."
      - name: note
        label: Nota de archivo
        type: text
        required: false
      - name: facts
        label: Datos de la ficha
        type: object
        required: false
        list:
          collapsible:
            collapsed: true
            summary: "{label}: {value}"
        fields:
          - name: label
            label: Campo
            type: string
          - name: value
            label: Valor
            type: string
      - name: body
        label: Información principal del expediente
        type: rich-text
        required: false
        description: "Aquí va la información extensa que sólo aparece al abrir el expediente completo."
      - name: sections
        label: Apartados / información descubierta
        type: object
        required: false
        list:
          max: 20
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Título del apartado
            type: string
          - name: body
            label: Contenido
            type: rich-text
      - name: gallery
        label: Galería del expediente
        type: object
        required: false
        list:
          max: 10
          collapsible:
            collapsed: true
            summary: "{index} · {caption}"
        fields:
          - name: image
            label: Imagen
            type: image
            required: true
          - name: caption
            label: Pie de imagen
            type: string
            required: false
          - name: description
            label: Nota / descripción
            type: text
            required: false

