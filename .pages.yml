        required: false
        description: "Opcional. Se muestra junto a los datos del expediente cuando se activa. En relatos y microrrelatos aparece antes de la lectura."
        fields:
          - name: enabled
            label: Mostrar corchera
            type: boolean
            default: false
          - name: design
            label: Diseño del tablón
            type: select
            default: A
            options:
              values: [A, B, C]
          - name: title
            label: Título del tablón
            type: string
            default: "TABLÓN DE CONEXIONES"
          - name: pieces
            label: Fotos y notas
            type: object
            required: false
            list:
              max: 12
              collapsible:
                collapsed: true
                summary: "{type} · {id}"
            fields:
              - name: id
                label: Identificador corto
                type: string
                required: true
                description: "Único en esta corchera; sirve para unir las piezas con hilos."
              - name: type
                label: Tipo de pieza
                type: select
                default: nota
                options:
                  values: [nota, foto]
              - name: title
                label: Título o pie de foto
                type: string
                required: false
              - name: text
                label: Texto de la nota
                type: text
