content:
  - name: relatos
    label: Relatos
    type: collection
    path: Aquello_que_nos_Rodea_WEB_CMS_v2/content/relatos
    format: json
    filename: "{primary}.json"
    view:
      fields: [archive_number, title, published, featured]
      primary: title
      sort: [archive_number, title]
      search: [title, excerpt, archive_number]
    fields:
      - name: title
        label: Título
        type: string
        required: true
      - name: slug
        label: Dirección web
        type: string
        required: true
        description: "Ejemplo: el-legado-de-rasputin. Solo letras, números y guiones."
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Usa solo minúsculas, números y guiones."
      - name: archive_number
        label: Número de archivo
        type: string
        default: "002"
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: published_date
        label: Fecha de publicación
        type: date
        required: false
        description: "Pon la fecha real de publicación. La etiqueta NOVEDAD se muestra automáticamente durante 7 días y después desaparece sola."
      - name: show_new_badge
        label: Mostrar NOVEDAD manualmente
        type: boolean
        default: false
        description: "Opcional. Actívalo para mostrar la etiqueta NOVEDAD aunque no uses fecha. Si indicas una fecha reciente, la etiqueta aparece automáticamente durante 7 días."
      - name: featured
        label: Destacar en portada
        type: boolean
        default: false
      - name: age_restricted
        label: Contenido +18
        type: boolean
        default: false
      - name: reading_time
        label: Tiempo de lectura
        type: string
        default: "10 min aprox."
      - name: excerpt
        label: Frase / descripción breve
        type: text
      - name: cover
        label: Portada
        type: image
        options:
          media: relatos
      - name: content_warning
        label: Advertencia de contenido
        type: text
        required: false
        description: "Describe únicamente los temas sensibles. El copyright tiene su propio campo."
      - name: legal_notice
        label: Aviso legal / copyright
        type: text
        required: false
        description: "Se muestra en un recuadro independiente al final de la lectura."
      - name: body
        label: Texto del relato
        type: rich-text
        options:
          media: relatos
      - name: show_related_archive
        label: Mostrar archivos relacionados
        type: boolean
        default: false
        description: "Actívalo cuando quieras revelar enlaces a expedientes relacionados. Si está desactivado, el bloque no aparece ni deja hueco."
      - name: related_archive
        label: Archivos relacionados
        type: object
        required: false
        description: "Opcional. Añade aquí los expedientes que quieras enlazar al final."
        list:
          max: 12
          collapsible:
            collapsed: true
            summary: "{type} · {title}"
        fields:
          - name: type
            label: Tipo
            type: select
            default: ARCHIVO
            options:
              values: [ARCHIVO, RELATO, MICRORRELATO, ENTIDAD, PERSONAJE, LUGAR, PLANO, ORGANIZACIÓN, DOCUMENTO, SUCESO, OTRO]
          - name: title
            label: Título visible
            type: string
            required: true
          - name: thumbnail
            label: Miniatura
            type: image
            required: false
            options:
              media: conexiones
            description: "Opcional. Imagen pequeña que aparecerá dentro de la tarjeta para hacer la conexión más visual."
          - name: url
            label: Enlace
            type: string
            required: true
            description: "Ejemplos: archivo-entidades-sukrahari.html, relato-el-legado-de-rasputin.html o micro-la-cita.html"
          - name: description
            label: Descripción breve
            type: text
            required: false

      - name: corkboard
        label: Corchera de esta ficha
        type: object
        required: false
        description: "Opcional. Se muestra junto a los datos del expediente cuando se activa. En relatos y microrrelatos aparece antes de la lectura."
        fields:
          - name: enabled
            label: Mostrar corchera
            type: boolean
            default: false
          - name: design
            label: Diseño del tablón
            type: select
            default: A
            options:
              values: [A, B, C]
          - name: title
            label: Título del tablón
            type: string
            default: "TABLÓN DE CONEXIONES"
          - name: pieces
            label: Fotos y notas
            type: object
            required: false
            list:
              max: 12
              collapsible:
                collapsed: true
                summary: "{type} · {id}"
            fields:
              - name: id
                label: Identificador corto
                type: string
                required: true
                description: "Único en esta corchera; sirve para unir las piezas con hilos."
              - name: type
                label: Tipo de pieza
                type: select
                default: nota
                options:
                  values: [nota, foto]
              - name: title
                label: Título o pie de foto
                type: string
                required: false
              - name: text
                label: Texto de la nota
                type: text
                required: false
              - name: image
                label: Imagen de la foto
                type: image
                required: false
                options:
                  media: relatos
              - name: x
                label: Posición horizontal (0–100)
                type: number
                required: false
              - name: y
                label: Posición vertical (0–100)
                type: number
                required: false
              - name: rotation
                label: Giro en grados (-12 a 12)
                type: number
                required: false
          - name: threads
            label: Hilos rojos
            type: object
            required: false
            description: "Une los identificadores de dos piezas de esta corchera."
            list:
              max: 18
              collapsible:
                collapsed: true
                summary: "{from} → {to}"
            fields:
              - name: from
                label: Desde la pieza
                type: string
                required: true
              - name: to
                label: Hasta la pieza
                type: string
                required: true

