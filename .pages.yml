  - name: libro_archivo
    label: Libro del Archivo y código de conexiones
    type: file
    path: Aquello_que_nos_Rodea_WEB_CMS_v2/content/config/libro-archivo.json
    format: json
    fields:
      - name: enabled
        label: Mostrar libro
        type: boolean
        default: true
        description: "Oculta o muestra el libro completo en la portada de El Archivo."
      - name: book_image
        label: Imagen del libro
        type: image
        options:
          media: interfaz
        description: "PNG del libro abierto. Si lo cambias por otro con la misma composición, las páginas seguirán encajando automáticamente."
      - name: random_mode
        label: Modo aleatorio
        type: boolean
        default: true
        description: "Activado: rota entre las páginas visibles. Desactivado: muestra siempre la página marcada como Imagen fija."
      - name: code_page_image
        label: Página secreta del código
        type: image
        required: false
        options:
          media: interfaz
        description: "Sube solo la tinta sobre fondo transparente. Esta página se añade automáticamente al libro y deja de aparecer en el navegador de quien ya desbloqueó las conexiones."
      - name: connection_code
        label: Código para abrir conexiones
        type: string
        required: true
        pattern:
          regex: "^[0-9]{6}$"
          message: "Introduce exactamente seis cifras."
        description: "Debe coincidir con el número escrito en la imagen secreta. Cambiarlo no vuelve a bloquear a quienes ya abrieron las conexiones en su navegador."
      - name: pages
        label: Otras imágenes de las páginas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Nombre interno
            type: string
            required: true
          - name: image
            label: Imagen PNG
            type: image
            required: true
            options:
              media: interfaz
          - name: enabled
            label: Mostrar esta imagen
            type: boolean
            default: true
          - name: first
            label: Mostrar primero
            type: boolean
            default: false
            description: "Marca una sola. Cada visitante la verá primero; después entra la rotación aleatoria."
          - name: fixed
            label: Imagen fija
            type: boolean
            default: false
            description: "Marca una sola. Se usa cuando Modo aleatorio está desactivado."
      - name: page_left
        label: Posición horizontal de la página (%)
        type: number
        default: 51
      - name: page_top
        label: Posición vertical de la página (%)
        type: number
        default: 9.5
      - name: page_width
        label: Ancho de la zona de página (%)
        type: number
        default: 44
      - name: page_height
        label: Alto de la zona de página (%)
        type: number
        default: 79.5
      - name: page_rotate
        label: Giro de la imagen (grados)
        type: number
        default: 0

