    format: json
    filename: "{primary}.json"
    view:
      fields: [archive_number, title, status, published]
      primary: title
      sort: [archive_number, title, status]
      search: [title, summary, archive_number, status]
    fields:
      - name: archive_number
        label: Número
        type: string
        required: true
      - name: title
        label: Nombre
        type: string
        required: true
      - name: slug
        label: Dirección web personalizada
        type: string
        required: false
        description: "Opcional. Si se deja vacío, la web la crea automáticamente a partir del nombre. Usa minúsculas, números y guiones."
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Usa solo minúsculas, números y guiones."
      - name: status
        label: Estado
        type: select
        default: RESTRINGIDO
        options:
          values: [DISPONIBLE, RESTRINGIDO, CORRUPTO, DESCONOCIDO]
      - name: published
        label: Publicado
        type: boolean
        default: true
      - name: image
        label: Imagen principal / miniatura
